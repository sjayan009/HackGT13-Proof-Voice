name: ci
on:
  push: { branches: [main, proofvoice-2.0] }
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - name: self-checks (codec, VAD, risk engine, scheduler)
        run: |
          cd api && python -m app.telephony.mulaw && python -m app.audio.realtime && python -m app.risk.engine && cd ..
          python -m engine.aegis
      - name: API tests (tiny random detector; no model weights, no network)
        run: cd api && python -m pytest app/tests -q -p no:warnings
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npx tsc --noEmit && npm run build
