# ProofVoice 2.0 local stack: API on the GPU + Prometheus + Grafana (dashboard provisioned).
#   docker compose -f infrastructure/docker-compose.yml up --build
services:
  api:
    build: { context: .., dockerfile: infrastructure/Dockerfile.serve }
    env_file: ../api/.env
    environment: [PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}]
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.2.0
    environment: [GF_AUTH_ANONYMOUS_ENABLED=true, GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer]
    volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["3001:3000"]
